name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v

      - name: Assert no OS-specific code outside the platform package
        shell: bash
        run: |
          if grep -rn "powershell\|/bin/bash\|win32\|darwin" src/nova --include=*.py \
             | grep -v "src/nova/platform/"; then
            echo "OS-specific code found outside src/nova/platform/"
            exit 1
          fi
          echo "clean"
